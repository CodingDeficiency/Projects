<section class="projects">
  <div class="projects__container">
    <header class="projects__header">
      <h1 class="projects__title">Featured Projects</h1>
      <p class="projects__subtitle">
        A curated selection of projects focusing on React, Node.js, and Mobile Development. I build
        accessible, pixel-perfect, and performant web experiences.
      </p>
    </header>

    <div class="projects__filters" role="tablist" aria-label="Project categories">
      <button
        class="projects__pill"
        *ngFor="let c of categories"
        type="button"
        [class.is-active]="activeCategory === c"
        (click)="setCategory(c)"
      >
        {{ c }}
      </button>
    </div>

    <div class="projects__grid">
      <article class="project-card" *ngFor="let p of filteredProjects">
        <div class="project-card__media" [attr.data-theme]="p.imageTheme">
          <div class="project-card__badge">{{ p.badge }}</div>
          <div class="project-card__media-inner"></div>
        </div>

        <div class="project-card__body">
          <h3 class="project-card__title">{{ p.title }}</h3>
          <p class="project-card__desc">{{ p.description }}</p>

          <div class="project-card__actions">
            <a
              class="project-btn"
              *ngFor="let a of p.actions"
              [href]="a.href"
              target="_blank"
              rel="noreferrer"
            >
              <i [class]="a.icon"></i>
              <span>{{ a.label }}</span>
            </a>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
